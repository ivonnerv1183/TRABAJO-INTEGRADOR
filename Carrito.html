<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <!-- Hojas de estilos modulares y separadas por responsabilidad -->
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/barra.css" />
    <link rel="stylesheet" href="css/tarjetas.css" />
    <link rel="stylesheet" href="css/formularios.css" />
    <link rel="stylesheet" href="css/usuarios.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrito</title>
  </head>
  <body>
    <header class="encabezado">
      <img class="logo" src="Imagenes/logo.jpeg" alt="Logo" />
      <div class="titulo-sub">
        <h1>ICASEmx</h1>
        <p>Fundas de telefono y mas.</p>
      </div>
    </header>

    <nav class="Barra">
      <ul class="barra-botones">
        <li><a href="Menu.html">Menu</a></li>
        <li><a href="Carrito.html">Carrito</a></li>
        <li><a href="VerPedidos.html">Pedidos</a></li>
        <li><a href="Usuario.html">Usuario</a></li>
        <li><a href="pedidos_anteriores.html">Historia</a></li>
      </ul>
    </nav>

    <!-- ---- articulos ---- -->

    <main class="contenido">
      <!-- Sección de Carrito -->

      <section>
        <h1>Carrito de compra</h1>
        <!-- Producto 1 -->
        <article class="tarjeta">
          <div class="tarjeta-contenido">
            <div class="perfil-contenido">
              <img
                src="productos/mini-consola.jpg"
                alt="carrito1"
                width="125"
                height="125"
              />
              <div class="titulo-sub">
                <h2>Mini consola portatil</portal></h2>
                <p>solo para Gaming se...</p>
              </div>
            </div>

            <!-- Contador de cantidad -->
            <div class="perfil-contenido">
              <button class="Boton-Articulo" type="menos">-</button>
              <input class="texbox" type="number" value="1" min="0" readonly />
              <button class="Boton-Articulo" type="mas">+</button>
            </div>
          </div>
        </article>

        <!-- Producto 2 -->
        <article class="tarjeta">
          <div class="tarjeta-contenido">
            <div class="perfil-contenido">
              <img src="productos/mica-privacidad.jpg" alt="carrito2" width="125" height="125" />
              <div class="titulo-sub">
                <h2>Mica Gorilla Glass 5</h2>
                <p>Funda de vidrio templad...</p>
              </div>
            </div>

            <!-- Contador de cantidad -->
            <div class="perfil-contenido">
              <button class="Boton-Articulo" type="menos">-</button>
              <input class="texbox" type="number" value="1" min="0" readonly />
              <button class="Boton-Articulo" type="mas">+</button>
            </div>
          </div>
        </article>
      </section>

      <!-- Pedidos y Pagos -->
      <article class="tarjeta">
        <div class="tarjeta-contenido form-usuario">
          <!-- Resumen de Costos -->
          <div class="form-grupo">
            <h3><strong>Subtotal</strong> $0.00</h3>
            <h3><strong>Total</strong> $0.00</h3>
          </div>

          <!-- Metodo de Pago -->
          <div class="form-grupo">
            <label class="form-label">Metodo de Pago</label>

            <form>
              <div class="radio-grupo">
                <label class="radio-label">
                  <input
                    type="radio"
                    name="MetodoPago"
                    value="Credito"
                    checked
                    class="radio"
                  />
                  <span>Tarjeta de Credito</span>
                </label>

                <label class="radio-label">
                  <input
                    type="radio"
                    name="MetodoPago"
                    value="Debito"
                    class="radio"
                  />
                  <span>Tarjeta de Debito</span>
                </label>

                <label class="radio-label">
                  <input
                    type="radio"
                    name="MetodoPago"
                    value="Efectivo"
                    class="radio"
                  />
                  <span>En Efectivo</span>
                </label>
              </div>
            </form>
          </div>

          <!-- cual targeta-->
          <div class="form-grupo">
            <label class="form-label">Tarjetas Guardadas</label>
            <select id="rango-seguridad" class="select-box">
              <option value="" disabled selected>Selecciona tarjenta</option>
              <option value="1">PlataCard | 4234</option>
              <option value="2">Banorte | 5342</option>
              <option value="3">BBVA | 8675</option>
            </select>
          </div>

          <!-- Direccion -->
          <div class="form-grupo">
            <label class="form-label">Direccion</label>
            <textarea id="TextoDireccion" class="textarea-box" rows="4">
Tubutama #20, Opodepe, Sonora, 75342</textarea
            >
            <button class="Boton-Articulo" type="EditarD">Editar</button>
          </div>

          <!-- Boton de Accion -->
          <button class="Boton-Articulo boton-form" type="Conti">
            Continuar
          </button>
        </div>
      </article>
    </main>
  </body>
</html>
