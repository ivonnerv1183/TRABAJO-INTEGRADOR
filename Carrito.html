
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carrito de compra</title>
</head>
<body>

    <aside class="menu_lateral"> <!-- etiqueta aside para el menu lateral-->
        <img class="menu_imagen" src="imagenes/logo.jpeg" alt="Logo de iCase" height="50" width="50">

        <nav>
            <ul>
                <li><a href="Menu.html">Menu</a></li>
                <li><a href="carrito.html">Carrito</a></li>
                <li><a href="VerPedidos.html">Pedidos</a></li>
                <li><a href="Usuario.html">Usuario</a></li>
                <li><a href="PedidosPasados.html">Historial</a></li>
                <li><a href="Inicio.html">Quienes somos?</a></li>
            </ul>
        </nav>

        <a href="login.html">Cerrar Sesión</a>
    </aside>
    
    <br>

    <header class="encabezado"> <!-- etiqueta header para el encabezado -->
        <button type="button" class="boton_menu"><img src="Imagenes/menu.png" alt="icono menú" height="25" width="25"></button>

        <img src="imagenes/logo.jpeg" alt="Logo de la pagina" width="50" height="50">

        <form class="buscador" action="#" method="get">
            <input type="search" name="busqueda">
            <button type="submit"> <img src="Imagenes/lupa.png" alt="lupa" height="25" width="25"></button>
        </form>

        <a href="carrito.html"><img src="Imagenes/carrito-de-compras.png" alt="icono carrito super" height="50" width="50"></a>
    </header>

    <br>

    <main>
        
        <!-- Sección de Carrito -->
        <section>
            <h2>Carrito de compra</h2>

            <!-- Producto -->
            <article>
                <img src="imagenes/51UalEeqp8L.jpg" alt="fundas de iPhone" width="125" height="125">
                <p>Cartera de iphone</p>
                
                <!-- Contador de cantidad -->
                <div>
                    <button type="button">-</button>
                    <input type="number" value="0" min="0" readonly>
                    <button type="button">+</button>
                </div>
            </article>
        </section>

        <!-- Resumen de Pedido y Pago -->
        <aside>
            <!-- Resumen de Costos -->
            <div>
                <p><strong>Subtotal</strong> $0.00</p>
                <p><strong>Total</strong> $0.00</p>
            </div>

            <!-- Método de Pago -->
            <section>
                <h3>Metodo de pago</h3>
                <form>
                    <label>
                        <input type="radio" name="metodo_pago" value="tarjeta" checked>
                        Tarjeta de debito
                    </label>
                    <br>
                    <label>
                        <input type="radio" name="metodo_pago" value="efectivo">
                        Efectivo
                    </label>
                </form>
            </section>

            <!-- Dirección -->
            <section>
                <h3>Direccion</h3>
                <p>
                    Tubutama #20, Opodepe, Son<br>
                    75342
                    <button type="button" title="Editar dirección">Editar</button>
                </p>
            </section>

            <!-- Botón de Acción -->
            <button type="button">Continuar</button>
        </aside>

    </main>

</body>
</html>
