<!DOCTYPE html>
<html lang="es-MX">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
</head>

<body>


    <!-- Inicio de Sesión -->
    <main>

        <section>
            <h1>¡Registrarse!</h1>

            <!--  Autenticación -->
            <form action="#" method="post">
                <p>
                    <label for="nombre">Nombre</label><br>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre" required>
                </p>

                <p>
                    <label for="apellidos">Apellidos</label><br>
                    <input type="text" id="apellidos" name="apellidos" placeholder="Ingrese su apellido" required>
                </p>

                <p>
                    <label for="correo">Correo</label><br>
                    <input type="email" id="correo" name="correo" placeholder="Ingrese su correo" required>
                </p>

                <p>
                    <label for="telefono">Teléfono</label><br>
                    <input type="tel" id="telefono" name="telefono" placeholder="Ingrese su teléfono" required>
                </p>

                <p>
                    <label for="contrasena">Contraseña</label><br>
                    <input type="password" id="contrasena" name="contrasena" placeholder="Ingrese su contraseña"
                        required>
                </p>

                <p>
                    <label for="confirmar_contrasena">Confirmar contraseña</label><br>
                    <input type="password" id="confirmar_contrasena" name="confirmar_contrasena" required>
                </p>

                <p>
                    <button type="submit">Enviar</button>
                </p>
                <p>
                    <a href="Login.html">Ya tienes cuenta? Inicia Sesión</a>
                </p>
            </form>

            <nav>
                <p>
                    <a href="Inicio.html">
                        <button type="button">Regresar</button>
                    </a>
                </p>
            </nav>

        </section>

    </main>

</body>

</html>
