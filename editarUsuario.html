<head>
    <meta charset="UTF-8">

</head>

<body>
    <aside class="menu_lateral"> <!-- etiqueta aside para el menu lateral-->
        <img class="menu_imagen" src="imagenes/logo.jpeg" alt="Logo de iCase" height="50" width="50">

        <nav>

                <li><a href="Menu.html">Menu</a></li>

        <a href="login.html">Cerrar Sesión</a>
    </aside>
    
    <h1>Tienda Icase</h1>
    <img src="Image/Icase.jpeg" alt="Icase" width="100">
    <h2>Editar empleados</h2>
    <h4>Usuario elegido</h4>
    <img src="Image/Obrador.jpg" alt="Usuario" width="100">
    <fieldset>
        <legend>Datos personales</legend>
        <div>
            <label for="usuario">Usuario: </label>
            <input type="text" id="usuario" name="usuario" placeholder="Nombre" required>
        </div>
        <div>
            <label for="correo">Correo electronico: </label>
            <input type="email" id="correo" name="correo" autocomplete="email" placeholder="Correo@gmail.com" required>
        </div>
        <div>
            <label for="telefono">Telefono: </label>
            <input type="text" id="telefono" name="telefono" placeholder="662020334--" required>
        </div>
        <div>
            <label for="direccion">Direccion: </label>
            <input type="text" id="direccion" name="direccion" placeholder="Ley 57, domicilio #32" required>
        </div>
        <div>
            <label for="contraseña">Contraseña: </label>
            <input type="text" id="contraseña" name="contraseña" placeholder="Lopez_3229" required>
        </div>
        <div>
            <button type="submit">Guardar</button>
        </div>
    </fieldset>
</body>
</html>
