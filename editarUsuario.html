<!DOCTYPE html>
<html lang="es-MX">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar a los usuarios</title>
</head>

<body>
    <h1>Tienda Icase</h1>
    <h2>Editar empleados</h2>
    <fieldset>
        <legend>Datos personales</legend>
        <div>
            <label for="usuario">Usuario elegido</label>
            <input type="text" id="usuario" name="usuario" placeholder="Andres Manuel Lopez" required>
        </div>
        <div>
            <label for="correo">Correo electronico: </label>
            <input type="email" id="correo" name="correo" autocomplete="email" placeholder="ManuelLopez@gmail.com" required>
        </div>
        <div>
            <label for="telefono">Telefono: </label>
            <input type="text" id="telefono" name="telefono" placeholder="662020334--" required>
        </div>
        <div>
            <label for="direccion">Direccion: </label>
            <input type="text" id="direccion" name="direccion" placeholder="Ley 57, domicilio #32" required>
        </div>
        <div>
            <label for="contraseña">Contraseña: </label>
            <input type="text" id="contraseña" name="contraseña" placeholder="Lopez_3229" required>
        </div>
        <div>
            <button type="submit">Guardar</button>
        </div>
        <div>
            <h4>Opciones</h4>
            <button type="submit">Menu</button>
        </div>
        <div>
            <button type="submit">Usuario</button>
        </div>
        <div>
            <button type="submit">Salir</button>
        </div>
    </fieldset>
</body>
</html>
